name: Release

# 打 tag v0.1.0 后自动构建并把安装包挂到 GitHub Release 上。
# Release 标题只写版本号，说明只写编号列表（见仓库 README 的发布说明）。
# 也可以手动触发（Actions → Release → Run workflow），用于 tag 已存在、
# 但 workflow 或代码修好之后需要重新出包的情况（重跑旧 run 会用旧 workflow，
# 所以不能用 Re-run）。
# Windows 发布用 exe 安装包（Inno Setup，见 windows/installer/tokicast.iss），
# 不用 MSIX：先 dotnet publish 自包含非打包应用（WindowsPackageType=None，
# WindowsAppSDKSelfContained=true，和 Tokinote 同一套做法），再用 ISCC 打成
# TokiCast-<version>.exe 安装器。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "要出包的 tag，例如 v0.1.0"
        required: true
        default: "v0.1.0"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - uses: microsoft/setup-msbuild@v2
      - name: Restore NuGet packages
        run: msbuild P2PKiwi.WinUI3.sln /t:Restore /p:Configuration=Release /p:Platform=x64
      - name: Get version without v prefix
        id: version
        shell: pwsh
        run: |
          $v = $env:RELEASE_TAG.TrimStart('v')
          echo "version=$v" >> $env:GITHUB_OUTPUT
      - name: Publish self-contained unpackaged app
        run: dotnet publish src/P2PKiwi.WinUI3/P2PKiwi.WinUI3.csproj -c Release -r win-x64 --self-contained true -p:Platform=x64 -p:WindowsPackageType=None -p:WindowsAppSDKSelfContained=true
      - name: Find publish output
        id: publish
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Recurse -Filter P2PKiwi.WinUI3.exe src/P2PKiwi.WinUI3/bin |
            Where-Object { $_.FullName -match '\\publish\\' } |
            Select-Object -First 1
          if (-not $exe) { throw "P2PKiwi.WinUI3.exe was not published" }
          echo "dir=$($exe.DirectoryName)" >> $env:GITHUB_OUTPUT
          Get-ChildItem $exe.DirectoryName | Select-Object Name, Length
      - name: Install Inno Setup
        run: choco install innosetup -y
      - name: Build installer
        shell: pwsh
        run: |
          ISCC.exe /DPublishDir="${{ steps.publish.outputs.dir }}" /DAppVersion="${{ steps.version.outputs.version }}" /DOutputBaseName="TokiCast-${{ steps.version.outputs.version }}" /O"installer" windows/installer/tokicast.iss
          $installer = "installer\TokiCast-${{ steps.version.outputs.version }}.exe"
          if (-not (Test-Path $installer)) { throw "Installer not found: $installer" }
          Get-FileHash $installer -Algorithm SHA256 | Format-List
          Get-Item $installer | Select-Object FullName, Length
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: ${{ steps.version.outputs.version }}
          files: installer/TokiCast-*.exe
          make_latest: true
      - name: Remove old .msixbundle asset
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete-asset ${{ env.RELEASE_TAG }} TokiCast-${{ steps.version.outputs.version }}.msixbundle --yes 2>$null
          Write-Host "old msixbundle asset removed (or already absent)"
