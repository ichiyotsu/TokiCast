name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - uses: microsoft/setup-msbuild@v2
      - name: Restore NuGet packages
        run: msbuild P2PKiwi.WinUI3.sln /t:Restore /p:Configuration=Release /p:Platform=x64
      - name: Restore and build (Release, x64)
        run: msbuild src/P2PKiwi.WinUI3/P2PKiwi.WinUI3.csproj /p:Configuration=Release /p:Platform=x64 /p:GenerateAppxPackageOnBuild=true /p:AppxBundle=Never /p:UapAppxPackageBuildMode=StoreUpload /p:AppxPackageSigningEnabled=false
      - name: Upload MSIX package
        uses: actions/upload-artifact@v4
        with:
          name: TokiCast-windows-x64
          path: src/P2PKiwi.WinUI3/**/*.msix
          if-no-files-found: error
